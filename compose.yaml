services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: "1"
      REDIS_URL: redis://redis:6379
      MFA_EVIDENCE_DIR: /app/var/mfa-evidence
    volumes:
      - mfa_evidence:/app/var/mfa-evidence
    depends_on:
      redis:
        condition: service_healthy
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SSO_DOMAIN: ${SSO_DOMAIN:?Set SSO_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: ["app"]
volumes:
  # Private evidence and wrapped per-document keys: exclude from backups/snapshots.
  # Do not run `docker compose down -v` while requests still depend on this data.
  mfa_evidence:
  redis_data:
  caddy_data:
  caddy_config:
